services:
  - type: web
    name: academiq-api
    plan: free
    runtime: node
    buildCommand: "COREPACK_ENABLE_STRICT=0 pnpm install --shamefully-hoist --no-frozen-lockfile --production=false && pnpm --filter @workspace/api-server build"
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
